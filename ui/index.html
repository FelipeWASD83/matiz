<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matiz</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <svg class="marca-icone" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.4"/>
        <g fill="currentColor" opacity=".55">
          <circle cx="7" cy="7" r="1.3"/><circle cx="12" cy="7" r="1.3"/><circle cx="7" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/>
          <circle cx="17" cy="12" r="1.3"/><circle cx="7" cy="17" r="1.3"/><circle cx="12" cy="17" r="1.3"/><circle cx="17" cy="17" r="1.3"/>
        </g>
        <circle cx="17" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span class="marca-nome">Matiz</span>
      <span class="marca-versao mono" id="versao"></span>
    </div>
    <div class="situacao" id="situacao" role="status">
      <span class="situacao-ponto"></span>
      <span class="situacao-texto" id="situacao-texto">Conectando…</span>
    </div>
    <div class="topo-direita">
      <span class="atalho-dica mono" id="atalho-dica"></span>
      <label class="chave" title="Liga e desliga o filtro em todas as telas">
        <input type="checkbox" id="ligado" checked>
        <span class="chave-trilho"><span class="chave-bolinha"></span></span>
        <span class="chave-rotulo">Filtro</span>
      </label>
    </div>
  </header>

  <main class="corpo">
    <nav class="grupos" id="grupos" aria-label="Grupos de ajustes"></nav>

    <section class="palco" aria-label="Prévia">
      <div class="moldura" id="moldura">
        <canvas id="previa"></canvas>
        <span class="selo" id="selo-original" hidden>Original</span>
        <p class="sem-webgl" id="sem-webgl" hidden>A prévia precisa de WebGL2 e ele não está disponível. O filtro na tela continua funcionando.</p>
      </div>
      <div class="faixa-estilos" id="faixa" aria-label="Estilos"></div>
      <div class="barra">
        <button class="pilula" id="b-original" title="Segure para ver a imagem sem filtro">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          Segure: original
        </button>
        <button class="pilula" id="b-testar" title="Segure para aplicar na tela de verdade enquanto esta janela está na frente">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 20h6M12 16.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Segure: ver na tela
        </button>
        <div class="imagens" id="imagens"></div>
        <button class="pilula fantasma" id="b-redefinir">Redefinir tudo</button>
      </div>
    </section>

    <aside class="painel" id="painel"></aside>
  </main>

  <div class="aviso" id="aviso" role="alert" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
